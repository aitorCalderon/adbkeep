# Builds the installers with tauri-action and attaches them to a draft GitHub release:
# AppImage, .deb, .rpm and a plain .tar.gz (Linux), .dmg (macOS, Apple silicon and Intel) and .msi/.exe (Windows).
# Runs on a `v*` tag or by hand.
#
# Each build downloads Google's platform-tools for its own OS (see scripts/fetch-platform-tools.mjs
# and docs/platform-tools-licence.md) and bundles the on-device helper built once from helper/.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release only builds if the CI checks pass on the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yml

  helper:
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # build-helper.mjs only uses Node built-ins.
      - run: node scripts/build-helper.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: helper-dex
          path: src-tauri/resources/helper/adbkeep-helper.dex
          if-no-files-found: error

  bundle:
    needs: helper
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
            args: ""
          - platform: macos-latest
            os: darwin
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            os: darwin
            args: "--target x86_64-apple-darwin"
            rust-target: x86_64-apple-darwin
          - platform: windows-latest
            os: windows
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-target }}

      # --force: never reuse an adb for another OS that may be in the checkout.
      - name: platform-tools for ${{ matrix.os }}
        run: node scripts/fetch-platform-tools.mjs ${{ matrix.os }} --force

      - uses: actions/download-artifact@v4
        with:
          name: helper-dex
          path: src-tauri/resources/helper

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "adbkeep ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Plain Linux tarball. Tauri looks for the resources in <exe dir>/../lib/adbkeep, so the
      # layout is a relocatable prefix: bin/adbkeep + lib/adbkeep/{platform-tools,helper}.
      - name: Linux tarball
        if: matrix.os == 'linux' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=adbkeep-linux-x86_64
          mkdir -p "$name/bin" "$name/lib/adbkeep"
          cp target/release/adbkeep "$name/bin/"
          cp -r src-tauri/resources/platform-tools src-tauri/resources/helper "$name/lib/adbkeep/"
          tar czf "$name.tar.gz" "$name"
          gh release upload "${{ github.ref_name }}" "$name.tar.gz" --clobber

      # Manual runs have no tag to publish to: keep the installers as run artifacts.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.rust-target || 'x64' }}
          path: target/**/release/bundle/
          if-no-files-found: error
