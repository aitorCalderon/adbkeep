[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
adbkeep-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "sync", "macros", "time"] }
which = "8"

# zstd, sha2 and sqlite are very slow unoptimized; our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
